baseURL = 'https://adamroe.dev/'
languageCode = 'en-us'
title = 'Adam Roe - Dot Dev'
theme = 'PaperMod'
paginate = 10

[params]
  defaultTheme = 'auto'
  showReadingTime = true
  showToc = true
  showPostNavLinks = true
  showBreadCrumbs = true
  showCodeCopyButtons = true
  showShareButtons = false

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/adamroe'

[menu]
  [[menu.main]]
    identifier = 'posts'
    name = 'Posts'
    url = '/posts/'
    weight = 10
  [[menu.main]]
    identifier = 'archives'
    name = 'Archive'
    url = '/archives/'
    weight = 20
  [[menu.main]]
    identifier = 'tags'
    name = 'Tags'
    url = '/tags/'
    weight = 30
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 40

[outputs]
  home = ['HTML', 'RSS', 'JSON']
